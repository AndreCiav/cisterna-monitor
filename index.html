<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitor Cisterna</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<main>
  <h1>Monitor Cisterna</h1>

  <section class="grid">
    <div class="card">
      <h2>Acqua</h2>
      <b id="acqua">-- %</b>
      <p>Altezza acqua cisterna: <span id="altezza">-- cm</span></p>
      <p>Distanza sensore: <span id="distanza">-- cm</span></p>
      <p>Litri: <span id="litri">-- / -- L</span></p>
    </div>
    
    <div class="card">
      <h2>Batteria</h2>
      <b id="batteria">-- %</b>
      <p>Tensione: <span id="volt">-- V</span></p>
    </div>

    <div class="card">
      <h2>Sistema</h2>
      <b id="stato">--</b>
      <p>Modalità: <span id="modo">--</span></p>
      <p>Ultimo: <span id="ultimo">--</span></p>
      <p>Prossimo: <span id="prossimo">--</span></p>
    </div>
  </section>


  
  <section class="card chartCard">
    <h2>Storico livello</h2>
    <div style="position: relative; height:300px; width:100%;">
      <canvas id="grafico"></canvas>
    </div>
  </section>

  <section class="card">
    <h2>Errori</h2>
    <p id="errori">--</p>
  </section>
</main>
  
  
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
