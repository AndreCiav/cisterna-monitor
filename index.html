<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Monitor Cisterna Acqua</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Monitor Cisterna Acqua</h1>

  <section id="dati-attuali">
    <h2>Dati attuali</h2>

    <p><strong>Livello acqua:</strong> 
      <span id="livello_cm">--</span> cm 
      (<span id="livello_percento">--</span> %)
    </p>

    <p><strong>Batteria:</strong> 
      <span id="batteria_volt">--</span> V 
      (<span id="batteria_percento">--</span> %)
    </p>

    <p><strong>Modalità:</strong> 
      <span id="modalita">--</span>
    </p>

    <p><strong>Ultimo aggiornamento:</strong> 
      <span id="data_ora">--</span>
    </p>
  </section>

  <section id="storico">
    <h2>Storico letture</h2>
    <p>Scarica il file CSV: 
      <a href="storico.csv" target="_blank">storico.csv</a>
    </p>
  </section>

  <script src="script.js"></script>
</body>
</html>
